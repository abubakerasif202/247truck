name: Inventory App CI

on:
  push:
    paths:
      - 'inventory-app/**'
      - '.github/workflows/inventory.yml'
  pull_request:
    paths:
      - 'inventory-app/**'
      - '.github/workflows/inventory.yml'

defaults:
  run:
    working-directory: inventory-app

permissions:
  contents: read

jobs:
  static:
    name: Lint, typecheck, unit, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: inventory-app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build

  audit:
    name: Production dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: inventory-app/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev

  coverage:
    name: Critical coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: inventory-app/package-lock.json
      - run: npm ci
      - run: npm run test:critical-coverage

  database:
    name: Integration + E2E (ephemeral local Supabase)
    runs-on: ubuntu-latest
    needs: static
    # This is a disposable local Supabase gate and must run on every inventory
    # pull request so required integration and E2E suites cannot silently skip.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: inventory-app/package-lock.json
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
      - name: Start a throwaway local Supabase and apply migrations
        run: |
          supabase start
          supabase db reset
      - name: Export local Supabase credentials
        run: |
          STATUS=$(supabase status -o json)
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$(echo "$STATUS" | jq -r .API_URL)"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$(echo "$STATUS" | jq -r .ANON_KEY)"
            echo "SUPABASE_SERVICE_ROLE_KEY=$(echo "$STATUS" | jq -r .SERVICE_ROLE_KEY)"
            echo "SUPABASE_TEST_URL=$(echo "$STATUS" | jq -r .API_URL)"
            echo "SUPABASE_TEST_ANON_KEY=$(echo "$STATUS" | jq -r .ANON_KEY)"
            echo "SUPABASE_TEST_SERVICE_ROLE_KEY=$(echo "$STATUS" | jq -r .SERVICE_ROLE_KEY)"
            echo "SUPABASE_TEST_ALLOW_DESTRUCTIVE=true"
            echo "NEXT_PUBLIC_INVENTORY_APP_URL=http://localhost:3100"
          } >> "$GITHUB_ENV"
      - name: Run integration tests
        id: integration
        continue-on-error: true
        run: npm run test:integration
      - name: Reset the disposable database before E2E
        id: e2e_reset
        if: always()
        continue-on-error: true
        run: supabase db reset --local --yes
      - name: Install Chromium
        id: playwright_install
        if: always()
        continue-on-error: true
        run: npx playwright install --with-deps chromium
      - name: Run Playwright E2E
        id: e2e
        if: ${{ always() && steps.e2e_reset.outcome == 'success' && steps.playwright_install.outcome == 'success' }}
        continue-on-error: true
        run: npm run test:e2e
      - name: Upload database diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inventory-database-diagnostics
          path: |
            inventory-app/.test-results/integration.json
            inventory-app/playwright-report
            inventory-app/test-results
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      - name: Enforce database and browser gates
        if: always()
        shell: bash
        run: |
          test "${{ steps.integration.outcome }}" = "success"
          test "${{ steps.e2e_reset.outcome }}" = "success"
          test "${{ steps.playwright_install.outcome }}" = "success"
          test "${{ steps.e2e.outcome }}" = "success"

  required:
    name: Inventory CI required status
    if: always()
    needs: [static, audit, coverage, database]
    runs-on: ubuntu-latest
    steps:
      - name: Require every inventory gate
        shell: bash
        env:
          STATIC_RESULT: ${{ needs.static.result }}
          AUDIT_RESULT: ${{ needs.audit.result }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
          DATABASE_RESULT: ${{ needs.database.result }}
        run: |
          printf '%s\n' \
            "static=$STATIC_RESULT" \
            "audit=$AUDIT_RESULT" \
            "coverage=$COVERAGE_RESULT" \
            "database=$DATABASE_RESULT" >> "$GITHUB_STEP_SUMMARY"
          for result in "$STATIC_RESULT" "$AUDIT_RESULT" "$COVERAGE_RESULT" "$DATABASE_RESULT"; do
            test "$result" = "success"
          done
