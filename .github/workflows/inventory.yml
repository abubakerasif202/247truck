name: Inventory App CI

on:
  push:
    paths:
      - 'inventory-app/**'
      - '.github/workflows/inventory.yml'
  pull_request:
    paths:
      - 'inventory-app/**'
      - '.github/workflows/inventory.yml'

defaults:
  run:
    working-directory: inventory-app

jobs:
  static:
    name: Lint, typecheck, unit, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: inventory-app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build

  database:
    name: Integration + E2E (ephemeral local Supabase)
    runs-on: ubuntu-latest
    needs: static
    # Keep the normal opt-in, and force the throwaway DB suite on the isolated
    # Phase 2A branch while purchasing migrations are under development.
    if: ${{ vars.RUN_INVENTORY_DB_TESTS == 'true' || github.head_ref == 'feat/inventory-phase-2a-purchasing' || github.ref == 'refs/heads/feat/inventory-phase-2a-purchasing' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: inventory-app/package-lock.json
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start a throwaway local Supabase and apply migrations
        run: |
          supabase start
          supabase db reset
      - name: Export local Supabase credentials
        run: |
          STATUS=$(supabase status -o json)
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$(echo "$STATUS" | jq -r .API_URL)"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$(echo "$STATUS" | jq -r .ANON_KEY)"
            echo "SUPABASE_SERVICE_ROLE_KEY=$(echo "$STATUS" | jq -r .SERVICE_ROLE_KEY)"
            echo "SUPABASE_TEST_URL=$(echo "$STATUS" | jq -r .API_URL)"
            echo "SUPABASE_TEST_ANON_KEY=$(echo "$STATUS" | jq -r .ANON_KEY)"
            echo "SUPABASE_TEST_SERVICE_ROLE_KEY=$(echo "$STATUS" | jq -r .SERVICE_ROLE_KEY)"
            echo "SUPABASE_TEST_ALLOW_DESTRUCTIVE=true"
            echo "NEXT_PUBLIC_INVENTORY_APP_URL=http://localhost:3100"
          } >> "$GITHUB_ENV"
      - run: npm run test:integration
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: inventory-app/playwright-report
