name: Temporary alignment navigation validation
on:
  push:
    branches: [feat/feature-alignment-in-top-nav]
    paths: [.github/workflows/temporary-alignment-validation.yml]
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Check styling, lint, types, tests and build
        run: |
          npm run lint
          npm run typecheck
          npm test
          npm run build
