# Local/disposable inventory database only. Never link this directory to the public website project.
project_id = "247truck-inventory"

[api]
enabled = true
port = 54331
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
auto_expose_new_tables = false

[db]
port = 54332
shadow_port = 54330
health_timeout = "2m"
major_version = 17

[db.pooler]
enabled = false
port = 54339
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = false

[studio]
enabled = false
port = 54333
api_url = "http://127.0.0.1"

[local_smtp]
enabled = false
port = 54334

[storage]
enabled = false
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3100"
additional_redirect_urls = ["http://localhost:3100"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = false
enable_anonymous_sign_ins = false
minimum_password_length = 8

[auth.email]
# Local integration fixtures create users through the Admin API and then sign
# in with email/password. Keep public self-signup disabled above, but leave the
# email provider enabled for the disposable local test stack.
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
secure_password_change = false
max_frequency = "1s"
otp_length = 6
otp_expiry = 3600

[edge_runtime]
enabled = false
policy = "per_worker"
inspector_port = 8084
deno_version = 2

[analytics]
enabled = false
port = 54337
backend = "postgres"
