                            <div className="text-lg font-mono font-extrabold text-white">
                              {tier.unitPrice === 0 ? "FITTING ONLY" : `$${tier.unitPrice} AUD / tyre`}
                            </div>
                            <div className="text-xs text-slate-400">
                              {tier.unitPrice === 0 ? "Roadside labor only" : `Total (${calculation.wheelCount}x): $${tier.unitPrice * calculation.wheelCount} AUD`}
                            </div>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>

                {/* CASING & TIMING TOGGLES */}
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                  <div 
                    onClick={() => setCasingCredit(!casingCredit)}
                    className="cursor-pointer bg-slate-900/90 border border-slate-800 p-4 rounded-xl flex items-center justify-between hover:border-slate-700"
                  >
                    <div>
                      <h4 className="font-bold text-white text-sm">Casing Exchange Credit (-$30/tyre)</h4>
                      <p className="text-xs text-slate-400 mt-0.5">Return sound, retreadable casing to receive credit</p>
                    </div>
                    <input 
                      type="checkbox" 
                      checked={casingCredit} 
                      onChange={() => {}}
                      className="w-5 h-5 accent-amber-500 rounded" 
                    />
                  </div>

                  <div 
                    onClick={() => setIsAfterHours(!isAfterHours)}
                    className="cursor-pointer bg-slate-900/90 border border-slate-800 p-4 rounded-xl flex items-center justify-between hover:border-slate-700"
                  >
                    <div>
                      <h4 className="font-bold text-white text-sm">After-Hours / Night / Weekend (+ $95)</h4>
                      <p className="text-xs text-slate-400 mt-0.5">For urgent breakdown dispatch outside 7am-5pm Mon-Fri</p>
                    </div>
                    <input 
                      type="checkbox" 
                      checked={isAfterHours} 
                      onChange={() => {}}
                      className="w-5 h-5 accent-amber-500 rounded" 
                    />
                  </div>
                </div>

                {/* STEP 3 FOOTER ACTIONS */}
                <div className="flex items-center justify-between pt-4 border-t border-slate-800">
                  <button
                    onClick={() => setCurrentStep(2)}
                    className="inline-flex items-center gap-2 px-4 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 font-semibold text-sm transition"
                  >
                    <Icon name="arrow-left" className="w-4 h-4" />
                    <span>Back to Location</span>
                  </button>
                  <button
                    onClick={() => setCurrentStep(4)}
                    className="inline-flex items-center gap-2 px-6 py-3 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold text-sm shadow-lg shadow-amber-500/20 transition"
                  >
                    <span>Calculate Live Quote</span>
                    <Icon name="arrow-right" className="w-4 h-4" />
                  </button>
                </div>
              </div>
            )}

            {/* STEP 4: LIVE QUOTE BREAKDOWN & DRIVER DETAILS */}
            {currentStep === 4 && (
              <div className="space-y-6">
                <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 pb-4 border-b border-slate-800">
                  <div>
                    <span className="text-xs font-bold uppercase tracking-wider text-amber-400">Step 4 of 5</span>
                    <h1 className="text-2xl sm:text-3xl font-extrabold text-white">Itemized Quote & Dispatch Details</h1>
                    <p className="text-sm text-slate-400">Transparent, no-surprise commercial pricing with target ETA from Regency Park.</p>
                  </div>
                  <div className="flex items-center gap-3">
                    <span className="px-3 py-1.5 rounded-lg bg-red-950 border border-red-700/60 text-red-400 font-mono text-xs font-bold flex items-center gap-1.5">
                      <span className="w-2 h-2 rounded-full bg-red-500 animate-ping-slow"></span>
                      DISPATCH READY • ETA: {calculation.estimatedEta}
                    </span>
                  </div>
                </div>

                <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
                  {/* LEFT COLUMN: ITEMIZED INVOICE PREVIEW */}
                  <div className="lg:col-span-7 space-y-4">
                    <div className="bg-slate-900/90 border border-slate-800 rounded-2xl p-6 space-y-4">
                      <div className="flex items-center justify-between pb-3 border-b border-slate-800">
                        <div className="flex items-center gap-2">
                          <Icon name="receipt" className="w-5 h-5 text-amber-400" />
                          <h3 className="font-bold text-white text-lg">Instant Quote Breakdown</h3>
                        </div>
                        <span className="text-xs font-mono text-slate-400">Currency: AUD (inc. GST)</span>
                      </div>

                      {/* LINE ITEMS */}
                      <div className="space-y-2.5 text-sm">
                        <div className="flex justify-between items-center py-1">
                          <span className="text-slate-300">
                            Mobile Rapid Call-Out ({calculation.zone.name})
                          </span>
                          <span className="font-mono font-semibold text-white">${calculation.calloutBase}</span>
                        </div>

                        {calculation.afterHoursFee > 0 && (
                          <div className="flex justify-between items-center py-1">
                            <span className="text-amber-400">Emergency / After-Hours Surcharge</span>
                            <span className="font-mono font-semibold text-amber-400">+ ${calculation.afterHoursFee}</span>
                          </div>
                        )}

                        <div className="flex justify-between items-center py-1">
                          <div>
                            <span className="text-slate-300">{calculation.tier.name}</span>
                            <div className="text-xs text-slate-400">Size: {tyreSize} ({calculation.wheelCount}x tyre @ ${calculation.tier.unitPrice})</div>
                          </div>
                          <span className="font-mono font-semibold text-white">${calculation.tyreCostTotal}</span>
                        </div>

                        <div className="flex justify-between items-center py-1">
                          <span className="text-slate-300">Heavy Vehicle Fitting, Bead Seal & Roadside Labour ({calculation.wheelCount}x)</span>
                          <span className="font-mono font-semibold text-white">${calculation.fittingLabor}</span>
                        </div>

                        {calculation.scrapDisposal > 0 && (
                          <div className="flex justify-between items-center py-1">
                            <span className="text-slate-300">Environmental Scrap Tyre Disposal ({calculation.wheelCount}x)</span>
                            <span className="font-mono font-semibold text-white">${calculation.scrapDisposal}</span>
                          </div>
                        )}

                        {calculation.casingDiscount > 0 && (
                          <div className="flex justify-between items-center py-1 text-green-400">
                            <span>Casing Exchange Rebate Credit ({calculation.wheelCount}x @ -$30)</span>
                            <span className="font-mono font-semibold">- ${calculation.casingDiscount}</span>
                          </div>
                        )}

                        <div className="pt-3 border-t border-slate-800 space-y-1.5 text-xs">
                          <div className="flex justify-between text-slate-400 font-mono">
                            <span>Subtotal (ex. GST):</span>
                            <span>${calculation.subtotal.toLocaleString()} AUD</span>
                          </div>
                          <div className="flex justify-between text-slate-400 font-mono">
                            <span>GST (10%):</span>
                            <span>${calculation.gst.toLocaleString()} AUD</span>
                          </div>
                        </div>

                        {/* TOTAL HIGHLIGHT */}
                        <div className="pt-3 border-t-2 border-slate-700 flex justify-between items-center">
                          <div>
                            <span className="text-base font-extrabold text-white">Estimated Total Cost</span>
                            <div className="text-xs text-slate-400">Includes roadside fitment & warranty</div>
                          </div>
                          <div className="text-right">
                            <span className="text-3xl font-extrabold font-mono text-amber-400">
                              ${calculation.total.toLocaleString()}
                            </span>
                            <span className="text-xs text-slate-400 ml-1 font-mono">AUD</span>
                          </div>
                        </div>
                      </div>
                    </div>

                    {/* TARGET SLA CALLOUT */}
                    <div className="bg-slate-900/60 border border-slate-800 rounded-xl p-4 flex items-center justify-between text-xs">
                      <div className="flex items-center gap-2 text-slate-300">
                        <Icon name="clock-3" className="w-4 h-4 text-amber-400" />
                        <span>Estimated Arrival Time:</span>
                      </div>
                      <span className="font-mono font-bold text-amber-400 text-sm">
                        {calculation.estimatedEta} (Direct Dispatch)
                      </span>
                    </div>
                  </div>

                  {/* RIGHT COLUMN: DRIVER & VEHICLE CONTACT FORM */}
                  <div className="lg:col-span-5 space-y-4">
                    <div className="bg-slate-900/90 border border-slate-800 rounded-2xl p-6 space-y-4">
                      <div className="flex items-center gap-2 pb-3 border-b border-slate-800">
                        <Icon name="user-check" className="w-5 h-5 text-amber-400" />
                        <h3 className="font-bold text-white text-lg">Driver & Dispatch Contact</h3>
                      </div>

                      <div className="space-y-3">
                        <div>
                          <label className="block text-xs font-bold text-slate-400 mb-1">Company / Fleet Name:</label>
                          <input
                            type="text"
                            value={companyName}
                            onChange={(e) => setCompanyName(e.target.value)}
                            className="w-full px-3.5 py-2.5 rounded-lg bg-slate-950 border border-slate-700 text-white text-sm focus:outline-none focus:border-amber-500"
                            placeholder="e.g. Adelaide Freight Logistics"
                          />
                        </div>

                        <div className="grid grid-cols-2 gap-3">
                          <div>
                            <label className="block text-xs font-bold text-slate-400 mb-1">Driver Name:</label>
                            <input
                              type="text"
                              value={driverName}
                              onChange={(e) => setDriverName(e.target.value)}
                              className="w-full px-3.5 py-2.5 rounded-lg bg-slate-950 border border-slate-700 text-white text-sm focus:outline-none focus:border-amber-500"
                              placeholder="e.g. Mick Henderson"
                            />
                          </div>
                          <div>
                            <label className="block text-xs font-bold text-slate-400 mb-1">Driver Mobile:</label>
                            <input
                              type="text"
                              value={driverPhone}
                              onChange={(e) => setDriverPhone(e.target.value)}
                              className="w-full px-3.5 py-2.5 rounded-lg bg-slate-950 border border-slate-700 text-white text-sm focus:outline-none focus:border-amber-500 font-mono"
                              placeholder="04xx xxx xxx"
                            />
                          </div>
                        </div>

                        <div>
                          <label className="block text-xs font-bold text-slate-400 mb-1">Truck Rego or Fleet Unit #:</label>
                          <input
                            type="text"
                            value={regoOrUnit}
                            onChange={(e) => setRegoOrUnit(e.target.value)}
                            className="w-full px-3.5 py-2.5 rounded-lg bg-slate-950 border border-slate-700 text-white text-sm focus:outline-none focus:border-amber-500 font-mono uppercase"
                            placeholder="e.g. SA-TRK-982 / UNIT-42"
                          />
                        </div>
                      </div>

                      <div className="pt-2">
                        <button
                          onClick={() => setCurrentStep(5)}
                          className="w-full py-3.5 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-extrabold text-base shadow-xl shadow-amber-500/20 transition flex items-center justify-center gap-2"
                        >
                          <Icon name="send" className="w-5 h-5" />
                          <span>Generate Dispatch Brief & Book</span>
                        </button>
                      </div>
                    </div>
                  </div>
                </div>

                {/* STEP 4 FOOTER ACTIONS */}
                <div className="flex items-center justify-between pt-4 border-t border-slate-800">
                  <button
                    onClick={() => setCurrentStep(3)}
                    className="inline-flex items-center gap-2 px-4 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 font-semibold text-sm transition"
                  >
                    <Icon name="arrow-left" className="w-4 h-4" />
                    <span>Back to Tyre Specs</span>
                  </button>
                </div>
              </div>
            )}

            {/* STEP 5: FINAL OPERATIONAL DISPATCH & LIVE RADAR SIMULATION */}
            {currentStep === 5 && (
              <div className="space-y-6">
                <div className="bg-gradient-to-r from-amber-500/20 via-slate-900 to-slate-900 border border-amber-500/40 rounded-2xl p-6 sm:p-8 flex flex-col md:flex-row md:items-center justify-between gap-6">
                  <div>
                    <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-green-500/20 text-green-400 border border-green-500/40 text-xs font-mono font-bold mb-3">
                      <span className="w-2 h-2 rounded-full bg-green-400 animate-ping-slow"></span>
                      DISPATCH READY: REF #TRK-{Math.floor(100000 + Math.random() * 900000)}
                    </div>
                    <h1 className="text-2xl sm:text-4xl font-extrabold text-white">Emergency Request Configured</h1>
                    <p className="text-sm text-slate-300 mt-1 max-w-xl">
                      Send this verified brief directly to the 24/7 Truck Tyre Services dispatch desk via WhatsApp or Call now to authorize immediate technician rollout.
                    </p>
                  </div>

                  <div className="flex flex-col sm:flex-row gap-3">
                    <a
                      href={`https://wa.me/61452636802?text=${generateWhatsAppText()}`}
                      target="_blank"
                      rel="noopener noreferrer"
                      className="inline-flex items-center justify-center gap-2 px-6 py-3.5 rounded-xl bg-green-600 hover:bg-green-500 text-white font-bold text-base shadow-lg shadow-green-600/30 transition"
                    >
                      <Icon name="message-square" className="w-5 h-5" />
                      <span>Send via WhatsApp</span>
                    </a>

                    <a
                      href={PHONE_HREF}
                      className="inline-flex items-center justify-center gap-2 px-6 py-3.5 rounded-xl bg-red-600 hover:bg-red-500 text-white font-bold text-base shadow-lg shadow-red-600/30 transition"
                    >
                      <Icon name="phone-call" className="w-5 h-5 animate-bounce" />
                      <span>Call {PHONE_NUMBER}</span>
                    </a>
                  </div>
                </div>

                <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
                  {/* LIVE DISPATCH SIMULATOR / RADAR */}
                  <div className="lg:col-span-6 space-y-4">
                    <div className="bg-slate-900/90 border border-slate-800 rounded-2xl p-6 relative overflow-hidden">
                      <div className="flex items-center justify-between pb-4 border-b border-slate-800">
                        <div className="flex items-center gap-2">
                          <Icon name="radar" className="w-5 h-5 text-amber-400" />
                          <h3 className="font-bold text-white text-base">Mobile Unit Live Radar</h3>
                        </div>
                        <span className="text-xs font-mono text-amber-400 font-bold">SA METRO DISPATCH</span>
                      </div>

                      {/* RADAR CANVAS MOCKUP */}
                      <div className="my-6 relative h-64 bg-slate-950 rounded-xl border border-slate-800 flex items-center justify-center overflow-hidden">
                        {/* Radar concentric circles */}
                        <div className="absolute w-48 h-48 rounded-full border border-slate-800"></div>
                        <div className="absolute w-32 h-32 rounded-full border border-slate-800"></div>
                        <div className="absolute w-16 h-16 rounded-full border border-slate-800"></div>
                        <div className="absolute w-full h-0.5 bg-slate-800/60"></div>
                        <div className="absolute h-full w-0.5 bg-slate-800/60"></div>
                        
                        {/* Rotating sweep */}
                        <div className="absolute w-56 h-56 rounded-full border-r-2 border-amber-500/40 radar-sweep-line pointer-events-none"></div>

                        {/* Regency Park Hub pin */}
                        <div className="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 flex flex-col items-center">
                          <span className="w-4 h-4 rounded-full bg-amber-500 border-2 border-slate-950 shadow-lg shadow-amber-500"></span>
                          <span className="text-[10px] font-mono font-bold text-amber-400 bg-slate-900/90 px-1.5 py-0.5 rounded mt-1 border border-slate-700">
                            Regency Park (HUB)
                          </span>
                        </div>

                        {/* Breakdown target pin */}
                        <div className="absolute top-1/4 right-1/4 flex flex-col items-center animate-bounce">
                          <span className="w-3.5 h-3.5 rounded-full bg-red-500 border-2 border-white shadow-lg shadow-red-500"></span>
                          <span className="text-[9px] font-mono font-bold text-red-400 bg-slate-900/90 px-1.5 py-0.5 rounded mt-1 border border-slate-700">
                            Target: {regoOrUnit}
                          </span>
                        </div>
                      </div>

                      {/* DISPATCH TIMELINE STATUS */}
                      <div className="space-y-3 text-xs">
                        <div className="flex items-start gap-3">
                          <div className="w-5 h-5 rounded-full bg-green-500/20 text-green-400 flex items-center justify-center font-bold text-[10px] border border-green-500/40 mt-0.5">✓</div>
                          <div>
                            <div className="font-bold text-white">1. Quote Verified & Position Mapped</div>
                            <div className="text-slate-400 font-mono">{selectedWheels.length}x {tyreSize} ({calculation.tier.name})</div>
                          </div>
                        </div>

                        <div className="flex items-start gap-3">
                          <div className="w-5 h-5 rounded-full bg-amber-500/20 text-amber-400 flex items-center justify-center font-bold text-[10px] border border-amber-500/40 mt-0.5">2</div>
                          <div>
                            <div className="font-bold text-white">2. Standby Unit Ready at Regency Park</div>
                            <div className="text-slate-400">Mobile Service Truck equipped with compressor & pneumatic tooling</div>
                          </div>
                        </div>

                        <div className="flex items-start gap-3">
                          <div className="w-5 h-5 rounded-full bg-slate-800 text-slate-400 flex items-center justify-center font-bold text-[10px] border border-slate-700 mt-0.5">3</div>
                          <div>
                            <div className="font-bold text-slate-300">3. Target Arrival ETA</div>
                            <div className="text-slate-400 font-mono font-bold text-amber-400">{calculation.estimatedEta} upon WhatsApp / Call confirmation</div>
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>

                  {/* DISPATCH BRIEF PREVIEW & COPY BOX */}
                  <div className="lg:col-span-6 space-y-4">
                    <div className="bg-slate-900/90 border border-slate-800 rounded-2xl p-6 space-y-4">
                      <div className="flex items-center justify-between pb-3 border-b border-slate-800">
                        <div className="flex items-center gap-2">
                          <Icon name="file-text" className="w-5 h-5 text-amber-400" />
                          <h3 className="font-bold text-white text-base">Operational Dispatch Brief</h3>
                        </div>
                        <button
                          onClick={copyDispatchBrief}
                          className="inline-flex items-center gap-1.5 px-3 py-1 rounded bg-slate-800 hover:bg-slate-700 text-xs font-mono font-bold text-slate-200 transition"
                        >
                          <Icon name={copied ? "check" : "copy"} className="w-3.5 h-3.5 text-amber-400" />
                          <span>{copied ? "COPIED TO CLIPBOARD!" : "COPY BRIEF"}</span>
                        </button>
                      </div>

                      <pre className="bg-slate-950 p-4 rounded-xl border border-slate-800 text-xs font-mono text-slate-300 whitespace-pre-wrap overflow-x-auto custom-scrollbar leading-relaxed">
{`24/7 TRUCK TYRE DISPATCH BRIEF
---------------------------------------
Company: ${companyName}
Driver: ${driverName} (${driverPhone})
Unit/Rego: ${regoOrUnit}
Vehicle: ${VEHICLE_CONFIGS[vehicleType].name}

Location: ${exactLocation}
Zone: ${calculation.zone.name}
Safety Status: ${safetyStatus.toUpperCase()}

Positions (${calculation.wheelCount}): ${selectedWheels.join(", ")}
Tyre Spec: ${tyreSize}
Brand Tier: ${calculation.tier.name}
Issue: ${issueType.toUpperCase()}

Total Estimate: $${calculation.total.toLocaleString()} AUD (inc. GST)
ETA: ${calculation.estimatedEta} from Regency Park
Driver Notes: ${notes || 'None'}`}
                      </pre>

                      <div className="pt-2 flex flex-col sm:flex-row items-center gap-3">
                        <button
                          onClick={() => window.print()}
                          className="w-full sm:w-auto flex-1 py-2.5 px-4 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 font-semibold text-xs transition flex items-center justify-center gap-2"
                        >
                          <Icon name="printer" className="w-4 h-4" />
                          <span>Print / Save PDF</span>
                        </button>
                        <button
                          onClick={() => {
                            setCurrentStep(1);
                            setSelectedWheels(["FLS"]);
                          }}
                          className="w-full sm:w-auto py-2.5 px-4 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold text-xs transition flex items-center justify-center gap-2"
                        >
                          <Icon name="rotate-ccw" className="w-4 h-4" />
                          <span>Start New Assessment</span>
                        </button>
                      </div>
                    </div>
                  </div>
                </div>

                {/* STEP 5 FOOTER */}
                <div className="flex items-center justify-between pt-4 border-t border-slate-800">
                  <button
                    onClick={() => setCurrentStep(4)}
                    className="inline-flex items-center gap-2 px-4 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 font-semibold text-sm transition"
                  >
                    <Icon name="arrow-left" className="w-4 h-4" />
                    <span>Back to Quote Review</span>
                  </button>
                </div>
              </div>
            )}
          </main>

          {/* SITE FOOTER */}
          <footer className="mt-auto border-t border-slate-800 bg-slate-950 py-4 px-4 sm:px-6 lg:px-8 text-center text-xs text-slate-500">
            <div className="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-2">
              <div>
                © {new Date().getFullYear()} <strong>24/7 Truck Tyre Services</strong> • Commercial Heavy Vehicle Tyre Assistance
              </div>
              <div className="font-mono text-slate-400">
                Regency Park, SA • Hotline: <a href={PHONE_HREF} className="text-amber-400 hover:underline">{PHONE_NUMBER}</a>
              </div>
            </div>
          </footer>
        </div>
      );
    }

    // Render the React App
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
